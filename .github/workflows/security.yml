# Universal Session Bot
# Author  : Sakil (@YO_UR_OFFICIAL_CRUSH)
# Telegram: https://t.me/YO_UR_OFFICIAL_CRUSH
# GitHub  : https://github.com/SakilSakil699
#
# Multi-layer security audit:
#   1. Secret scanning (TruffleHog, Gitleaks)
#   2. Dependency audit (pip-audit, Safety)
#   3. Static analysis (CodeQL, Bandit)
#   4. Docker image scan (Trivy)

name: 🛡️ Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ═══════════════════════════════════════════════
  #  JOB 1: Secret Scanning
  # ═══════════════════════════════════════════════
  secret-scan:
    name: 🔐 Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --json
        continue-on-error: true

      - name: 🔍 Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: 🔎 Custom pattern check
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          EXIT=0
          # Telegram API patterns
          if grep -rE "api_hash\s*=\s*['\"][a-f0-9]{32}['\"]" \
             --include="*.py" --exclude-dir=tests . 2>/dev/null; then
            echo "❌ Hardcoded API_HASH found"
            EXIT=1
          fi
          # Bot tokens
          if grep -rE "bot_token\s*=\s*['\"][0-9]{8,10}:" \
             --include="*.py" --exclude-dir=tests . 2>/dev/null; then
            echo "❌ Hardcoded BOT_TOKEN found"
            EXIT=1
          fi
          # Private keys
          if grep -rE "BEGIN (RSA|OPENSSH|PRIVATE) KEY" . 2>/dev/null; then
            echo "❌ Private key found"
            EXIT=1
          fi
          if [ $EXIT -eq 0 ]; then
            echo "✅ No hardcoded secrets detected"
          fi
          exit $EXIT

  # ═══════════════════════════════════════════════
  #  JOB 2: Dependency Audit
  # ═══════════════════════════════════════════════
  dependency-audit:
    name: 📦 Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: 🔍 pip-audit (CVEs in dependencies)
        run: |
          echo "🔍 Auditing dependencies for CVEs..."
          pip-audit -r requirements.txt --format=json --output=pip-audit.json || true
          pip-audit -r requirements.txt --desc on || true
        continue-on-error: true

      - name: 🔍 Safety check (alternative scanner)
        run: |
          pip install -r requirements.txt
          safety check --json > safety-report.json || true
          safety check || true
        continue-on-error: true

      - name: 📤 Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            safety-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════
  #  JOB 3: Static Analysis
  # ═══════════════════════════════════════════════
  static-analysis:
    name: 🔬 Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: 🔍 Bandit security scan
        run: |
          echo "🔍 Running Bandit security scan..."
          bandit -r \
            bot/ core/ crypto/ db/ engines/ handlers/ \
            keyboards/ utils/ config/ \
            -f txt -ll || true
          
          bandit -r \
            bot/ core/ crypto/ db/ engines/ handlers/ \
            keyboards/ utils/ config/ \
            -f json -o bandit-report.json || true
        continue-on-error: true

      - name: 📤 Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════
  #  JOB 4: CodeQL Analysis
  # ═══════════════════════════════════════════════
  codeql:
    name: 🔬 CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔬 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 🔬 Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ═══════════════════════════════════════════════
  #  JOB 5: Docker Image Scan
  # ═══════════════════════════════════════════════
  docker-scan:
    name: 🐳 Docker Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🏗️ Build Docker image
        run: |
          docker build -t universal-session-bot:scan .

      - name: 🔍 Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: universal-session-bot:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: 📤 Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ═══════════════════════════════════════════════
  #  JOB 6: Summary
  # ═══════════════════════════════════════════════
  summary:
    name: 📊 Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, static-analysis]
    if: always()

    steps:
      - name: 📊 Generate summary
        run: |
          echo "## 🛡️ Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Bot:** Universal Session Bot" >> $GITHUB_STEP_SUMMARY
          echo "**Author:** Sakil (@YO_UR_OFFICIAL_CRUSH)" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔬 Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Made with ❤️ by [Sakil](https://t.me/YO_UR_OFFICIAL_CRUSH)*" >> $GITHUB_STEP_SUMMARY
