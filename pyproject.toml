# Universal Session Bot
# Author  : Sakil (@YO_UR_OFFICIAL_CRUSH)
# Telegram: https://t.me/YO_UR_OFFICIAL_CRUSH
# GitHub  : https://github.com/SakilSakil699

[project]
name = "universal-session-bot"
version = "1.0.0"
description = "Advanced Telegram session generator with multi-format support"
authors = [
    { name = "Sakil", email = "t.me/YO_UR_OFFICIAL_CRUSH" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/SakilSakil699/universal-session-bot"
Repository = "https://github.com/SakilSakil699/universal-session-bot"
"Bug Tracker" = "https://github.com/SakilSakil699/universal-session-bot/issues"
Telegram = "https://t.me/YO_UR_OFFICIAL_CRUSH"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
